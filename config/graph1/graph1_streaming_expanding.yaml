# Expanding-window streaming Graph 1 (product roadmap).
algo:
  dimred: [pca]
  rank_selection_method: [explained_variance]
  threshold: [0.9]
  recursive_method: [full]
  depth: [1]
  search_method: [pelt]
  detection_backend: [kernel_ruptures]
  feature_map_approx_method: [rff]
  feature_map_kernel_params:
    - kernel: rbf
      gamma_method: median
  num_features: [30]
  num_mappings: [1]
  ruptures_kernel_params:
    - kernel: rbf
      gamma_method: median
  post_processing_method: [majority_voting]
  min_regime_length: [20]
  include_last_regime: [true]

streaming:
  enabled: true
  mode: expanding
  step: 80
  min_history: 200
  lock_prefix: true
  match_tolerance: 5

test:
  choice: [mmd_no_ts]
  lag:
    - method: user_specified
      lag: 5
  window:
    - method: user_specified
      window: 40
  sample_size:
    - method: user_specified
      num_samples: 40
  significance_level: [0.05]

metrics:
  mode: write
  dir: ${IMG_DIR}
  plot: false
  explainability_features: ["__auto__"]
  features_to_plot: ["__auto__"]

log:
  dir: ${LOG_DIR}
  level: INFO

robustness:
  enabled: false

stability:
  enabled: false

uncertainty:
  enabled: false

panel:
  enabled: false
