# Calibrated uncertainty bands on breakpoints (product roadmap).
algo:
  dimred: [pca]
  rank_selection_method: [explained_variance]
  threshold: [0.9]
  recursive_method: [full]
  depth: [2]
  search_method: [pelt]
  detection_backend: [kernel_ruptures]
  feature_map_approx_method: [rff]
  feature_map_kernel_params:
    - kernel: rbf
      gamma_method: median
  num_features: [30]
  num_mappings: [1]
  ruptures_kernel_params:
    - kernel: rbf
      gamma_method: median
  post_processing_method: [majority_voting]
  min_regime_length: [20]
  include_last_regime: [true]

uncertainty:
  enabled: true
  sources: [robustness, bootstrap]
  level: 0.9
  match_tolerance: 5
  n_bootstrap: 4
  bootstrap_block: 25
  random_state: 42

robustness:
  enabled: false
  perturbations:
    depth: [1, 2]
    significance_level: [0.05, 0.1]
    min_regime_length: [15, 25]
  match_tolerance: 5
  low_persistence_threshold: 0.5

test:
  choice: [mmd_no_ts]
  lag:
    - method: user_specified
      lag: 5
  window:
    - method: user_specified
      window: 40
  sample_size:
    - method: user_specified
      num_samples: 40
  significance_level: [0.05]

metrics:
  mode: write
  dir: ${IMG_DIR}
  plot: false
  explainability_features: ["__auto__"]
  features_to_plot: ["__auto__"]

log:
  dir: ${LOG_DIR}
  level: INFO

stability:
  enabled: false

streaming:
  enabled: false

panel:
  enabled: false
