# Product artifacts: CI ribbons on plots + Excel export + NDJSON event stream.
algo:
  dimred: [pca]
  rank_selection_method: [explained_variance]
  threshold: [0.9]
  recursive_method: [full]
  depth: [2]
  search_method: [pelt]
  detection_backend: [kernel_ruptures]
  feature_map_approx_method: [rff]
  feature_map_kernel_params:
    - kernel: rbf
      gamma_method: median
  num_features: [30]
  num_mappings: [1]
  ruptures_kernel_params:
    - kernel: rbf
      gamma_method: median
  post_processing_method: [majority_voting]
  min_regime_length: [20]
  include_last_regime: [true]

uncertainty:
  enabled: true
  sources: [bootstrap]
  level: 0.9
  match_tolerance: 5
  n_bootstrap: 4
  bootstrap_block: 25
  random_state: 42

# Optional workbook for Breakpoints / CI / PanelSupport sheets.
# Override with path, or with dir + filename (defaults under metrics.dir).
export:
  excel:
    enabled: true
    path: null
    dir: null
    filename: bkpt_export.xlsx

# Dashboard-friendly NDJSON stream (one JSON object per line).
events:
  enabled: true
  path: null
  dir: null
  filename: events.ndjson
  append: false

test:
  choice: [mmd_no_ts]
  lag:
    - method: user_specified
      lag: 5
  window:
    - method: user_specified
      window: 40
  sample_size:
    - method: user_specified
      num_samples: 40
  significance_level: [0.05]

metrics:
  mode: write
  dir: ${IMG_DIR}
  plot: true
  plot_ci_ribbons: true
  explainability_features: ["__auto__"]
  features_to_plot: ["__auto__"]

log:
  dir: ${LOG_DIR}
  level: INFO

robustness:
  enabled: false

stability:
  enabled: false

streaming:
  enabled: false

panel:
  enabled: false
