# Graph 2 with within-regime PCA residual heatmap (panel coherence).
# Strong fit for YCS SOURCE_TENOR and equity ticker panels that co-move.
algo:
  dimred: [pca]
  rank_selection_method: [explained_variance]
  threshold: [0.9]
  recursive_method: [full]
  depth: [2]
  feature_map_approx_method: [rff]
  feature_map_kernel_params:
    - kernel: rbf
      gamma_method: median
  num_features: [50]
  num_mappings: [1]
  ruptures_kernel_params:
    - kernel: rbf
      gamma_method: median
  post_processing_method: [majority_voting]
  min_regime_length: [20]
  include_last_regime: [true]

test:
  choice: [mmd_no_ts]
  lag:
    - method: user_specified
      lag: 5
  window:
    - method: user_specified
      window: 40
  sample_size:
    - method: user_specified
      num_samples: 40
  significance_level: [0.05]

metrics:
  mode: write
  dir: ${IMG_DIR}
  plot: true
  explainability_features: ["__auto__"]
  features_to_plot: ["__auto__"]

log:
  dir: ${LOG_DIR}
  level: INFO

robustness:
  enabled: false

stability:
  enabled: false

retrain:
  interactive: false
  features: ["__auto__"]
  num_worst_features: 5
  score_method: factor_residual
  score:
    n_components: 1
  threshold: 0.01
  max_iter: 10
  regimes_df: null
