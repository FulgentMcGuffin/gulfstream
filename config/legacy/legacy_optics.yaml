algo:
  dimred: [raw]
  feature_map_approx_method: [raw]
  regime_detection_algorithm: [optics]
  optics_min_samples: [10]
  optics_xi: [0.05]
  optics_cluster_method: [xi]
  post_processing_method: [no_post_processing]
  min_regime_length: [1]
  include_last_regime: [true]

metrics:
  mode: write
  dir: ${IMG_DIR}
  plot: true
  explainability_features: ["__auto__"]
  features_to_plot: ["__auto__"]
  regime_cluster_algorithms: [kmeans, hdbscan, optics]

log:
  dir: ${LOG_DIR}
  level: INFO
