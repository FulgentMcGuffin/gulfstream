[project]
name = "gulfstream"
version = "0.1.0"
description = "Regime detection pipelines (Graph 1 / Graph 2 / legacy)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arch>=8.0.0",
    "asttokens>=3.0.2",
    "duckdb>=1.2.0",
    "faiss-cpu",
    "faker",
    "fastparquet>=2026.5.0",
    "framecache",
    "hmmlearn>=0.3.3",
    "lightning>=2.0",
    "matplotlib>=3.10.0",
    "mcp-data",
    "networkx>=3.6.1",
    "numpy>=2.5.1",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "panelyzer",
    "plotnine>=0.15.7",
    "polars>=1.43.0",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "pytorch-forecasting>=1.0",
    "pytorch-optimizer>=3.10.1",
    "pyyaml>=6.0",
    "ruptures>=1.1.9",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.0",
    "sf-hamilton>=1.90.0",
    "statsmodels>=0.14.0",
    "torch>=2.13.0",
]

[project.scripts]
gulfstream = "gulfstream.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gulfstream"]

[tool.uv.sources]
framecache = { git = "https://github.com/FulgentMcGuffin/framecache.git" }
mcp-data = { git = "https://github.com/FulgentMcGuffin/mcp_data.git" }
panelyzer = { git = "https://github.com/FulgentMcGuffin/panelyzer.git" }

[dependency-groups]
dev = [
    "comm>=0.2.3",
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
